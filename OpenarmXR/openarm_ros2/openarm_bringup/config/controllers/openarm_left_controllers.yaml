controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position

left_forward_effort_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: effort

left_gripper_controller:
  ros__parameters:
    joints:
      - openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
    interpolation_method: "none"
